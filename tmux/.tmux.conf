unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse off

set -g base-index 1
setw -g pane-base-index 1

setw -g mode-keys vi
set -g status-keys vi

bind - split-window -v
bind | split-window -h

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

bind c new-window

bind n next-window
bind p previous-window

bind ] next-window
bind [ previous-window

bind x kill-pane
bind X kill-window

bind q display-panes

bind r source-file ~/.tmux.conf \; display-message "tmux.conf neu geladen"

bind -r C-h select-pane -L
bind -r C-j select-pane -D
bind -r C-k select-pane -U
bind -r C-l select-pane -R

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy"

set -g status-style bg=colour235,fg=colour250
set -g status-left " #[fg=green]#S "
set -g status-right " #[fg=yellow]%Y-%m-%d #[fg=cyan]%H:%M "

run-shell "tmux ai init || true"
